
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore permanent signing key
        env:
          LOCKDOWN_KEYSTORE_BASE64: ${{ secrets.LOCKDOWN_KEYSTORE_BASE64 }}
          LOCKDOWN_KEYSTORE_PASSWORD: ${{ secrets.LOCKDOWN_KEYSTORE_PASSWORD }}
          LOCKDOWN_KEY_PASSWORD: ${{ secrets.LOCKDOWN_KEY_PASSWORD }}
          LOCKDOWN_KEY_ALIAS: ${{ secrets.LOCKDOWN_KEY_ALIAS }}
        run: |
          if [ -z "$LOCKDOWN_KEYSTORE_BASE64" ] || [ -z "$LOCKDOWN_KEYSTORE_PASSWORD" ] || [ -z "$LOCKDOWN_KEY_PASSWORD" ] || [ -z "$LOCKDOWN_KEY_ALIAS" ]; then
            echo "Missing signing secrets"
            exit 1
          fi
          echo "$LOCKDOWN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lockdown-release.jks"
          echo "LOCKDOWN_KEYSTORE_FILE=$RUNNER_TEMP/lockdown-release.jks" >> "$GITHUB_ENV"
          echo "LOCKDOWN_KEYSTORE_PASSWORD=$LOCKDOWN_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "LOCKDOWN_KEY_PASSWORD=$LOCKDOWN_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "LOCKDOWN_KEY_ALIAS=$LOCKDOWN_KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: LockdownAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lockdown-debug-apk
          path: LockdownAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
